<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дурень</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>

<!-- JOIN -->
<div id="s-join" class="screen active">
  <div class="logo">♠ ДУРЕНЬ ♠</div>
  <div class="logo-sub">Карткова гра</div>
  <div class="join-card">
    <button class="btn-gold" onclick="createAndJoin()">🃏 Створити гру</button>
    <div class="join-divider">— або увійти за кодом —</div>
    <input id="inp-room" class="field-input" type="text" placeholder="Наприклад: AB12CD" maxlength="8" style="text-transform:uppercase;margin-bottom:0">
    <button class="btn-outline" style="margin-top:8px" onclick="joinRoom()">Увійти →</button>
  </div>
  <div class="rooms-section">
    <div class="rooms-label">Відкриті кімнати</div>
    <div id="rooms-list"><div class="rooms-loading">Завантаження...</div></div>
  </div>
</div>

<!-- LOBBY -->
<div id="s-lobby" class="screen">
  <div class="lobby-header">
    <div class="lobby-title">♠ Дурень — Лобі</div>
    <div class="lobby-room" id="lobby-room-id">Кімната: —</div>
  </div>
  <div class="player-list" id="player-list"></div>
  <div class="lobby-actions">
    <button class="btn-gold" id="btn-start" onclick="startGame()" style="display:none">🃏 Розпочати гру</button>
    <div class="lobby-hint" id="lobby-hint">Очікуємо гравців...</div>
    <button class="action-btn btn-ghost" id="btn-leave" onclick="leaveRoom()" style="display:none;margin-top:8px">← Вийти з кімнати</button>
  </div>
</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div class="top-bar">
    <div class="deck-widget">
      <div class="deck-trump-mini" id="deck-trump-mini">
        <span class="dtm-rank" id="dtm-rank">—</span>
        <span class="dtm-suit" id="dtm-suit"></span>
      </div>
      <div class="deck-cnt" id="deck-num">0</div>
      <div class="deck-lbl">колода</div>
    </div>
    <div class="turn-text" id="turn-text">—</div>
    <div style="width:48px"></div>
  </div>
  <div class="opponents-row" id="opponents-row"></div>
  <div class="table-zone" id="table-zone"><div class="table-empty">Стіл порожній</div></div>
  <div class="msg-bar" id="msg-bar"></div>
  <div id="hint-bar"></div>
  <div class="actions-bar" id="actions-bar"></div>
  <div class="my-hand-area">
    <div class="hand-label" id="hand-label">Ваші карти</div>
    <div class="hand-row" id="hand-row"></div>
  </div>
</div>

<!-- END -->
<div id="s-end" class="screen">
  <div class="end-title">🃏 Гра завершена!</div>
  <div class="end-sub" id="end-sub"></div>
  <div class="rank-list" id="rank-list"></div>
  <button class="btn-gold" style="max-width:240px" onclick="backToLobby()">Зіграти ще раз</button>
  <button class="btn-gold" style="max-width:240px;margin-top:8px" onclick="goHome()">Закрити</button>
</div>

<div class="toast" id="toast"></div>

<script src="/static/game.js?v=3"></script>
</body>
</html>
